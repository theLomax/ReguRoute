services:
  # PostgreSQL Database with PostGIS extension
  db:
    image: postgis/postgis:15-3.3
    container_name: reguroute-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=reguroute
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reguroute"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenRouteService (ORS) for routing
  ors-app:
    container_name: reguroute-ors
    image: openrouteservice/openrouteservice:latest
    ports:
      - '8080:8082'
    volumes:
      - ./ors/graphs:/home/ors/graphs
      - ./ors/elevation_cache:/home/ors/elevation_cache
      - ./ors/data:/home/ors/files
    environment:
      - REBUILD_GRAPHS=True
      - ors.engine.profile_default.build.source_file=/home/ors/files/delaware-251114.osm.pbf
      - XMS=1g
      - XMX=2g
    restart: unless-stopped

  # The Fastify Backend Application
  backend:
    container_name: reguroute-backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: builder
    ports:
      - '3000:3000'
    volumes:
      - ./apps/backend/src:/usr/src/app/apps/backend/src
      - ./apps/backend/migrations:/usr/src/app/apps/backend/migrations
      - ./apps/backend/package.json:/usr/src/app/apps/backend/package.json
      - ./apps/backend/tsconfig.json:/usr/src/app/apps/backend/tsconfig.json
      - ./apps/backend/tsconfig.migrations.json:/usr/src/app/apps/backend/tsconfig.migrations.json
      - ./apps/backend/dev-entrypoint.sh:/usr/src/app/apps/backend/dev-entrypoint.sh
      - ./tsconfig.base.json:/usr/src/app/tsconfig.base.json
    env_file: ./apps/backend/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: sh ./apps/backend/dev-entrypoint.sh
    restart: unless-stopped

volumes:
  db_data: