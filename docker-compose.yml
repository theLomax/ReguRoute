services:
  # PostgreSQL Database with PostGIS extension
  db:
    image: postgis/postgis:15-3.3
    container_name: reguroute-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=reguroute
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reguroute"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenRouteService (ORS) for routing
  ors-app:
    container_name: reguroute-ors
    image: openrouteservice/openrouteservice:latest
    ports:
      - '8080:8080'
    volumes:
      - ./ors/graphs:/ors-core/data/graphs
      - ./ors/elevation_cache:/ors-core/data/elevation_cache
      - ./ors/conf:/ors-core/conf
      - ./ors/data:/ors-core/data/osm_file
    environment:
      - BUILD_GRAPHS=True
      - "JAVA_OPTS=-Djava.awt.headless=true -server -XX:TargetSurvivorRatio=75 -XX:SurvivorRatio=64 -XX:MaxTenuringThreshold=3 -XX:+UseG1GC -XX:+ScavengeBeforeFullGC -XX:ParallelGCThreads=4 -Xms1g -Xmx2g"
      - "ORS_CONFIG_LOCATION=/ors-core/conf/ors-config.json"
    restart: unless-stopped

  # The Fastify Backend Application
  backend:
    container_name: reguroute-backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: builder
    ports:
      - '3000:3000'
    volumes:
      - ./apps/backend:/usr/src/app/apps/backend
      - ./package.json:/usr/src/app/package.json
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./tsconfig.base.json:/usr/src/app/tsconfig.base.json
      - /usr/src/app/node_modules
    env_file: ./apps/backend/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: sh -c "pnpm install && pnpm --filter backend run dev"
    restart: unless-stopped

volumes:
  db_data: